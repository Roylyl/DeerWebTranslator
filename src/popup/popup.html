<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DeerWebTranslator</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand-mark" aria-hidden="true">
          <img src="../../icons/icon48.png" alt="" width="38" height="38">
        </div>
        <div>
          <h1>DeerWebTranslator</h1>
          <p id="page-label" class="muted">当前页面</p>
          <p id="provider-label" class="muted">加载配置…</p>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <div class="status-row">
          <span id="status-label">未开始</span>
          <span id="progress-label">0 / 0</span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="翻译进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="detail-label" class="detail-label">将当前页面的可见英文快速替换为中文译文。</p>
      </section>

      <div class="primary-actions">
        <button id="translate-button" class="button button-primary" type="button">翻译当前页面</button>
        <button id="stop-button" class="button button-secondary" type="button" disabled>停止翻译</button>
      </div>

      <section class="mode-section" aria-labelledby="mode-title">
        <div class="section-heading">
          <h2 id="mode-title">显示模式</h2>
          <span class="muted">即时生效</span>
        </div>
        <div class="mode-switch" role="group" aria-label="翻译显示模式">
          <button class="mode-button active" data-mode="translation" aria-pressed="true" type="button">仅译文</button>
          <button class="mode-button" data-mode="bilingual" aria-pressed="false" type="button">双语</button>
          <button class="mode-button" data-mode="original" aria-pressed="false" type="button">仅原文</button>
        </div>
      </section>

      <p id="error-label" class="error-label" role="alert" hidden></p>

      <footer class="popup-footer">
        <span id="key-status" class="muted">使用自己的 API Key</span>
        <button id="settings-button" class="link-button" type="button">设置</button>
      </footer>
    </main>
    <script src="../shared/constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
